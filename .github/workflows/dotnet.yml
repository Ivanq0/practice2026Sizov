name: .NET CI

on:
  push:
    branches: [ "task01" ]

defaults:
  run:
    working-directory: practice2026

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Build
      run: dotnet build
    - name: Test
      run: dotnet test --no-restore --verbosity normal